name: Update architecture multi-tenancy batch

on:
  push:
    paths:
      - '.architecture-multitenancy-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update architecture catalog and sitemap
        run: python scripts/update_architecture_multitenancy_batch.py
      - name: Commit changes and clean helper files
        run: |
          git config user.name "anton-dot"
          git config user.email "66353024+anton-dot@users.noreply.github.com"
          rm -f scripts/update_architecture_multitenancy_batch.py
          rm -f .github/workflows/update-architecture-multitenancy-batch.yml
          rm -f .architecture-multitenancy-trigger
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update architecture catalog with multi-tenancy batch"
            git push
          fi
