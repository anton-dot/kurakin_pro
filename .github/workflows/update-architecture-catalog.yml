name: Update architecture catalog

on:
  push:
    paths:
      - '.architecture-catalog-trigger'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert architecture cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          new_slugs = [
              'slo-error-budget-business',
              'canary-deployment-business',
              'schema-registry-business',
              'data-contracts-business',
              'policy-as-code-business',
          ]

          ru_cards = [
              ('scale', 'cloud', '<article class="publication-item"><div class="publication-meta"><span>5 мин</span></div><div class="publication-copy"><p class="publication-source">Архитектура · статья</p><h3><a href="../articles/slo-error-budget-business.html">SLO и Error Budget: сколько надёжности действительно нужно бизнесу</a></h3><p>Как договориться о нужном уровне сервиса, связать допустимый риск со скоростью изменений и не переплачивать за недостижимые 100%.</p></div><nav class="publication-versions" aria-label="Доступные языковые версии"><a href="../articles/slo-error-budget-business.html" aria-current="true">RU</a><a href="../../en/articles/slo-error-budget-business.html">EN</a></nav></article>'),
              ('cloud', 'security', '<article class="publication-item"><div class="publication-meta"><span>5 мин</span></div><div class="publication-copy"><p class="publication-source">Архитектура · статья</p><h3><a href="../articles/canary-deployment-business.html">Canary Deployment: зачем выпускать новую версию сначала на небольшую часть трафика</a></h3><p>Как ограничить радиус неудачного релиза, проверить новую версию на реальном трафике и только потом расширять rollout.</p></div><nav class="publication-versions" aria-label="Доступные языковые версии"><a href="../articles/canary-deployment-business.html" aria-current="true">RU</a><a href="../../en/articles/canary-deployment-business.html">EN</a></nav></article>'),
              ('events', 'data', '<article class="publication-item"><div class="publication-meta"><span>5 мин</span></div><div class="publication-copy"><p class="publication-source">Архитектура · статья</p><h3><a href="../articles/schema-registry-business.html">Schema Registry: как менять события, не ломая десятки потребителей</a></h3><p>Как сделать контракт событий явным, автоматически проверять совместимость и не превращать изменение поля в массовую миграцию.</p></div><nav class="publication-versions" aria-label="Доступные языковые версии"><a href="../articles/schema-registry-business.html" aria-current="true">RU</a><a href="../../en/articles/schema-registry-business.html">EN</a></nav></article>'),
              ('analytics', 'ai', '<article class="publication-item"><div class="publication-meta"><span>5 мин</span></div><div class="publication-copy"><p class="publication-source">Архитектура · статья</p><h3><a href="../articles/data-contracts-business.html">Data Contracts: почему данные тоже должны иметь владельца и договорённости</a></h3><p>Как закрепить смысл, качество, владельца и правила изменения данных, которыми уже пользуются другие команды.</p></div><nav class="publication-versions" aria-label="Доступные языковые версии"><a href="../articles/data-contracts-business.html" aria-current="true">RU</a><a href="../../en/articles/data-contracts-business.html">EN</a></nav></article>'),
              ('security', 'domain', '<article class="publication-item"><div class="publication-meta"><span>5 мин</span></div><div class="publication-copy"><p class="publication-source">Архитектура · статья</p><h3><a href="../articles/policy-as-code-business.html">Policy as Code: почему правила безопасности не должны жить только в документах</a></h3><p>Как превратить часть security и compliance требований в автоматические проверки и уменьшить количество ручных согласований.</p></div><nav class="publication-versions" aria-label="Доступные языковые версии"><a href="../articles/policy-as-code-business.html" aria-current="true">RU</a><a href="../../en/articles/policy-as-code-business.html">EN</a></nav></article>'),
          ]

          en_cards = [
              ('scale', 'cloud', '<article class="publication-item"><div class="publication-meta"><span>5 min</span></div><div class="publication-copy"><p class="publication-source">Architecture · article</p><h3><a href="../articles/slo-error-budget-business.html">SLO and Error Budgets: How Much Reliability Does the Business Actually Need?</a></h3><p>How to agree on the service level that matters, connect acceptable risk with delivery speed, and avoid overpaying for impossible perfection.</p></div><nav class="publication-versions" aria-label="Available language versions"><a href="../../ru/articles/slo-error-budget-business.html">RU</a><a href="../articles/slo-error-budget-business.html" aria-current="true">EN</a></nav></article>'),
              ('cloud', 'security', '<article class="publication-item"><div class="publication-meta"><span>5 min</span></div><div class="publication-copy"><p class="publication-source">Architecture · article</p><h3><a href="../articles/canary-deployment-business.html">Canary Deployment: Why Release a New Version to a Small Share of Traffic First?</a></h3><p>How to limit the blast radius of a bad release, validate a version on real traffic, and expand only when the signals stay healthy.</p></div><nav class="publication-versions" aria-label="Available language versions"><a href="../../ru/articles/canary-deployment-business.html">RU</a><a href="../articles/canary-deployment-business.html" aria-current="true">EN</a></nav></article>'),
              ('events', 'data', '<article class="publication-item"><div class="publication-meta"><span>5 min</span></div><div class="publication-copy"><p class="publication-source">Architecture · article</p><h3><a href="../articles/schema-registry-business.html">Schema Registry: How to Change Events Without Breaking Dozens of Consumers</a></h3><p>How to make event contracts explicit, validate compatibility automatically, and avoid turning a field change into a coordinated migration.</p></div><nav class="publication-versions" aria-label="Available language versions"><a href="../../ru/articles/schema-registry-business.html">RU</a><a href="../articles/schema-registry-business.html" aria-current="true">EN</a></nav></article>'),
              ('analytics', 'ai', '<article class="publication-item"><div class="publication-meta"><span>5 min</span></div><div class="publication-copy"><p class="publication-source">Architecture · article</p><h3><a href="../articles/data-contracts-business.html">Data Contracts: Why Data Also Needs Owners and Agreements</a></h3><p>How to define meaning, quality, ownership, and change rules for data that other teams already depend on.</p></div><nav class="publication-versions" aria-label="Available language versions"><a href="../../ru/articles/data-contracts-business.html">RU</a><a href="../articles/data-contracts-business.html" aria-current="true">EN</a></nav></article>'),
              ('security', 'domain', '<article class="publication-item"><div class="publication-meta"><span>5 min</span></div><div class="publication-copy"><p class="publication-source">Architecture · article</p><h3><a href="../articles/policy-as-code-business.html">Policy as Code: Why Security Rules Should Not Live Only in Documents</a></h3><p>How to turn part of security and compliance governance into automatic checks instead of growing manual approval queues.</p></div><nav class="publication-versions" aria-label="Available language versions"><a href="../../ru/articles/policy-as-code-business.html">RU</a><a href="../articles/policy-as-code-business.html" aria-current="true">EN</a></nav></article>'),
          ]

          def find_id(text, category):
              for needle in (f'id="{category}"', f"id='{category}'"):
                  pos = text.find(needle)
                  if pos >= 0:
                      return pos
              raise RuntimeError(f'category not found: {category}')

          def insert_cards(path, cards):
              text = Path(path).read_text(encoding='utf-8')
              for category, next_category, card in cards:
                  slug = card.split('../articles/', 1)[1].split('.html', 1)[0]
                  if slug in text:
                      continue
                  start = find_id(text, category)
                  end = find_id(text, next_category)
                  close = text.rfind('</div></section>', start, end)
                  if close < 0:
                      raise RuntimeError(f'category close not found: {category}')
                  text = text[:close] + card + text[close:]
              for slug in new_slugs:
                  if slug not in text:
                      raise RuntimeError(f'missing new card: {slug} in {path}')
              Path(path).write_text(text, encoding='utf-8')

          insert_cards('ru/architecture/index.html', ru_cards)
          insert_cards('en/architecture/index.html', en_cards)
          PY
      - name: Commit catalog changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .architecture-catalog-trigger .github/workflows/update-architecture-catalog.yml
          git add ru/architecture/index.html en/architecture/index.html
          git commit -m "Update architecture catalogs with next article batch"
          git push
