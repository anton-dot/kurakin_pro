name: Add CEO automation guides
on:
  push:
    paths:
      - '.ceo-automation-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CEO automation guides
        run: python scripts/add_ceo_automation_guides.py
      - name: Validate CEO guides
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          slugs = ['ceo-automation-adoption','ceo-automation-governance']
          for lang in ('ru','en'):
              for slug in slugs:
                  p = Path(lang)/'articles'/(slug+'.html')
                  assert p.exists(), p
                  text = p.read_text(encoding='utf-8')
                  assert text.count('<h1>') == 1, p
                  assert '<article class="article-content">' in text, p
                  body = text.split('<article class="article-content">',1)[1].split('</article>',1)[0]
                  assert '<img' not in body, p
                  assert '<time' not in body, p
                  assert f'https://kurakin-anton.ru/{lang}/articles/{slug}.html' in text, p
                  for href in re.findall(r'href="([^"]+\.html)"', body):
                      if '://' not in href and not href.startswith('../') and not href.startswith('../../'):
                          assert (p.parent/href).exists(), (p, href)
              idx = (Path(lang)/'architecture'/'index.html').read_text(encoding='utf-8')
              start = idx[idx.index("class='architecture-start'"):idx.index("class='architecture-nav-section'")]
              for slug in slugs:
                  assert slug+'.html' in start, (lang, slug)
          sm = Path('sitemap-architecture.xml').read_text(encoding='utf-8')
          for slug in slugs:
              for lang in ('ru','en'):
                  assert f'https://kurakin.pro/{lang}/articles/{slug}.html' in sm
          css = Path('assets/architecture.css').read_text(encoding='utf-8')
          assert '.architecture-feature + .architecture-feature' in css
          print('validated CEO automation guides')
          PY
      - name: Commit and clean helper files
        run: |
          git config user.name "anton-dot"
          git config user.email "66353024+anton-dot@users.noreply.github.com"
          rm -f scripts/add_ceo_automation_guides.py .ceo-automation-trigger .github/workflows/add-ceo-automation-guides.yml
          git add -A
          git commit -m "Add CEO automation guides"
          git push
