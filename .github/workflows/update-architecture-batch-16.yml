name: Update architecture batch 16

on:
  push:
    paths:
      - '.github/architecture-batch-16.trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate articles and update catalog
        run: python .github/scripts/update_architecture_batch_16.py
      - name: Commit changes and clean helper files
        run: |
          rm -f .github/scripts/update_architecture_batch_16.py
          rm -f .github/workflows/update-architecture-batch-16.yml
          rm -f .github/architecture-batch-16.trigger
          git config user.name "anton-dot"
          git config user.email "66353024+anton-dot@users.noreply.github.com"
          git add -A
          git commit -m "Add architecture batch 16"
          git push
