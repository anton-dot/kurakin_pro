name: Update architecture governance batch

on:
  push:
    paths:
      - '.github/architecture-governance-batch.trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update catalog and sitemap
        run: python .github/scripts/update-architecture-batch-governance.py
      - name: Commit changes and clean helper files
        run: |
          rm -f .github/scripts/update-architecture-batch-governance.py
          rm -f .github/workflows/update-architecture-batch-governance.yml
          rm -f .github/architecture-governance-batch.trigger
          git config user.name "anton-dot"
          git config user.email "66353024+anton-dot@users.noreply.github.com"
          git add ru/architecture/index.html en/architecture/index.html sitemap-architecture.xml .github
          git commit -m "Update architecture catalog with governance batch"
          git push
