name: Update architecture org cost batch
on:
  push:
    paths:
      - '.github/scripts/add_architecture_batch_org_cost.py'
      - '.github/workflows/update-architecture-org-cost-batch.yml'
      - '.github/architecture-org-cost-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate articles and update catalog
        run: python .github/scripts/add_architecture_batch_org_cost.py
      - name: Commit changes and clean helper files
        run: |
          rm -f .github/scripts/add_architecture_batch_org_cost.py
          rm -f .github/workflows/update-architecture-org-cost-batch.yml
          rm -f .github/architecture-org-cost-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add SSO, Team Topologies, Expand-Contract, FinOps and Model Routing articles"
          git push
