name: Update architecture batch 15

on:
  push:
    paths:
      - '.github/architecture-batch-trigger-15.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update architecture catalog and sitemap
        run: python .github/scripts/update_architecture_batch_15.py
      - name: Commit changes and clean helper files
        run: |
          rm -f .github/scripts/update_architecture_batch_15.py
          rm -f .github/architecture-batch-trigger-15.txt
          rm -f .github/workflows/update-architecture-batch-15.yml
          git config user.name "anton-dot"
          git config user.email "66353024+anton-dot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Integrate architecture batch 15"
          git push
