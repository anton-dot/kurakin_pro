name: Fix Semantic Cache catalog card
on:
  push:
    paths:
      - '.semantic-cache-fix-trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move Semantic Cache card into AI section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cards = {
            'ru/architecture/index.html': '<article class="publication-item"><div class="publication-meta"><span>5 мин</span></div><div class="publication-copy"><p class="publication-source">Архитектура · статья</p><h3><a href="../articles/semantic-cache-business.html">Semantic Cache: когда AI не должен заново отвечать на почти тот же вопрос</a></h3><p>Как снижать стоимость и latency AI-запросов, не начав возвращать устаревшие или чужие ответы из-за слишком агрессивного кэша.</p></div><nav class="publication-versions" aria-label="Доступные языковые версии"><a href="../articles/semantic-cache-business.html" aria-current="true">RU</a><a href="../../en/articles/semantic-cache-business.html">EN</a></nav></article>',
            'en/architecture/index.html': '<article class="publication-item"><div class="publication-meta"><span>5 min</span></div><div class="publication-copy"><p class="publication-source">Architecture · article</p><h3><a href="../articles/semantic-cache-business.html">Semantic Cache: When AI Should Not Answer Almost the Same Question Again</a></h3><p>How to reduce AI cost and latency without returning stale or cross-user answers because the cache treated different requests as equivalent.</p></div><nav class="publication-versions" aria-label="Available language versions"><a href="../../ru/articles/semantic-cache-business.html">RU</a><a href="../articles/semantic-cache-business.html" aria-current="true">EN</a></nav></article>'
          }

          for path, card in cards.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text = text.replace(card, '')
              m = re.search(r"<section class=['\"]architecture-category['\"] id=['\"]ai['\"]>", text)
              if not m:
                  raise RuntimeError(f'AI section not found in {path}')
              end = text.find('</div></section>', m.end())
              if end < 0:
                  raise RuntimeError(f'AI section end not found in {path}')
              text = text[:end] + card + text[end:]
              p.write_text(text, encoding='utf-8')

              ai_start = text.index("id='ai'") if "id='ai'" in text else text.index('id="ai"')
              card_pos = text.index('semantic-cache-business.html')
              footer_pos = text.index('<footer', ai_start)
              assert ai_start < card_pos < footer_pos
          PY
      - name: Commit fix and clean helper files
        shell: bash
        run: |
          git config user.name "anton-dot"
          git config user.email "66353024+anton-dot@users.noreply.github.com"
          git rm -f .github/workflows/fix-semantic-cache-card.yml .semantic-cache-fix-trigger
          git add ru/architecture/index.html en/architecture/index.html
          git commit -m "Fix Semantic Cache catalog placement"
          git push