name: Fix Model Routing catalog card
on:
  push:
    paths:
      - '.github/workflows/fix-model-routing-card.yml'
      - '.github/model-routing-fix-trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Model Routing card into AI section
        run: |
          python - <<'PY'
          from pathlib import Path
          for lang in ('ru','en'):
              p = Path(lang) / 'architecture' / 'index.html'
              s = p.read_text(encoding='utf-8')
              marker = '<article class="publication-item"><div class="publication-meta"><span>5 мин</span>' if lang == 'ru' else '<article class="publication-item"><div class="publication-meta"><span>5 min</span>'
              href = '../articles/model-routing-business.html'
              pos = s.find(href)
              if pos < 0:
                  raise SystemExit(f'Model Routing card not found in {lang}')
              start = s.rfind('<article class="publication-item">', 0, pos)
              end = s.find('</article>', pos) + len('</article>')
              card = s[start:end]
              s = s[:start] + s[end:]
              ai_start = s.index("<section class='architecture-category' id='ai'>")
              ai_close = s.find('</div></section>', ai_start)
              if ai_close < 0:
                  raise SystemExit(f'AI section close not found in {lang}')
              s = s[:ai_close] + card + s[ai_close:]
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and clean helper files
        run: |
          rm -f .github/workflows/fix-model-routing-card.yml .github/model-routing-fix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Model Routing architecture catalog placement"
          git push
