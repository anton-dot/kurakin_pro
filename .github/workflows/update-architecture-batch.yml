name: Update architecture batch
on:
  push:
    paths:
      - '.architecture-batch-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update catalog and sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          updates = {
            'ru/architecture/index.html': [
              ('events', 'backpressure-business.html', '<article class="publication-item"><div class="publication-meta"><span>5 мин</span></div><div class="publication-copy"><p class="publication-source">Архитектура · статья</p><h3><a href="../articles/backpressure-business.html">Backpressure: почему система должна уметь замедлять поток, а не только обрабатывать быстрее</a></h3><p>Как переживать перегрузку управляемо: замедлять поток, сохранять критические операции и не превращать растущую очередь в общую аварию.</p></div><nav class="publication-versions" aria-label="Доступные языковые версии"><a href="../articles/backpressure-business.html" aria-current="true">RU</a><a href="../../en/articles/backpressure-business.html">EN</a></nav></article>'),
              ('data', 'database-indexing-business.html', '<article class="publication-item"><div class="publication-meta"><span>5 мин</span></div><div class="publication-copy"><p class="publication-source">Архитектура · статья</p><h3><a href="../articles/database-indexing-business.html">Индексы базы данных: почему ускорение чтения делает запись дороже</a></h3><p>Как ускорять важные запросы осознанно и почему каждый новый индекс увеличивает стоимость записи, хранения и обслуживания базы.</p></div><nav class="publication-versions" aria-label="Доступные языковые версии"><a href="../articles/database-indexing-business.html" aria-current="true">RU</a><a href="../../en/articles/database-indexing-business.html">EN</a></nav></article>'),
              ('scale', 'cell-based-architecture.html', '<article class="publication-item"><div class="publication-meta"><span>5 мин</span></div><div class="publication-copy"><p class="publication-source">Архитектура · статья</p><h3><a href="../articles/cell-based-architecture.html">Cell-Based Architecture: как ограничить радиус аварии архитектурой</a></h3><p>Как разделить клиентов на независимые ячейки, чтобы один инцидент не становился глобальным, и сколько стоит такая изоляция.</p></div><nav class="publication-versions" aria-label="Доступные языковые версии"><a href="../articles/cell-based-architecture.html" aria-current="true">RU</a><a href="../../en/articles/cell-based-architecture.html">EN</a></nav></article>'),
              ('security', 'key-management-business.html', '<article class="publication-item"><div class="publication-meta"><span>5 мин</span></div><div class="publication-copy"><p class="publication-source">Архитектура · статья</p><h3><a href="../articles/key-management-business.html">Key Management: почему шифрование бесполезно без управления ключами</a></h3><p>Как хранить, ротировать и отзывать ключи так, чтобы шифрование действительно уменьшало последствия утечки, а не создавало иллюзию защиты.</p></div><nav class="publication-versions" aria-label="Доступные языковые версии"><a href="../articles/key-management-business.html" aria-current="true">RU</a><a href="../../en/articles/key-management-business.html">EN</a></nav></article>'),
              ('ai', 'semantic-cache-business.html', '<article class="publication-item"><div class="publication-meta"><span>5 мин</span></div><div class="publication-copy"><p class="publication-source">Архитектура · статья</p><h3><a href="../articles/semantic-cache-business.html">Semantic Cache: когда AI не должен заново отвечать на почти тот же вопрос</a></h3><p>Как снижать стоимость и latency AI-запросов, не начав возвращать устаревшие или чужие ответы из-за слишком агрессивного кэша.</p></div><nav class="publication-versions" aria-label="Доступные языковые версии"><a href="../articles/semantic-cache-business.html" aria-current="true">RU</a><a href="../../en/articles/semantic-cache-business.html">EN</a></nav></article>'),
            ],
            'en/architecture/index.html': [
              ('events', 'backpressure-business.html', '<article class="publication-item"><div class="publication-meta"><span>5 min</span></div><div class="publication-copy"><p class="publication-source">Architecture · article</p><h3><a href="../articles/backpressure-business.html">Backpressure: Why a System Must Be Able to Slow the Flow, Not Just Process Faster</a></h3><p>How to survive overload deliberately by slowing demand, protecting critical operations, and stopping queue growth from becoming a general outage.</p></div><nav class="publication-versions" aria-label="Available language versions"><a href="../../ru/articles/backpressure-business.html">RU</a><a href="../articles/backpressure-business.html" aria-current="true">EN</a></nav></article>'),
              ('data', 'database-indexing-business.html', '<article class="publication-item"><div class="publication-meta"><span>5 min</span></div><div class="publication-copy"><p class="publication-source">Architecture · article</p><h3><a href="../articles/database-indexing-business.html">Database Indexing: Why Faster Reads Make Writes More Expensive</a></h3><p>How to speed up important queries intentionally and why every new index increases write, storage, and maintenance cost.</p></div><nav class="publication-versions" aria-label="Available language versions"><a href="../../ru/articles/database-indexing-business.html">RU</a><a href="../articles/database-indexing-business.html" aria-current="true">EN</a></nav></article>'),
              ('scale', 'cell-based-architecture.html', '<article class="publication-item"><div class="publication-meta"><span>5 min</span></div><div class="publication-copy"><p class="publication-source">Architecture · article</p><h3><a href="../articles/cell-based-architecture.html">Cell-Based Architecture: How to Limit the Blast Radius by Design</a></h3><p>How to split customers into independent cells so one incident does not become global, and what that isolation costs.</p></div><nav class="publication-versions" aria-label="Available language versions"><a href="../../ru/articles/cell-based-architecture.html">RU</a><a href="../articles/cell-based-architecture.html" aria-current="true">EN</a></nav></article>'),
              ('security', 'key-management-business.html', '<article class="publication-item"><div class="publication-meta"><span>5 min</span></div><div class="publication-copy"><p class="publication-source">Architecture · article</p><h3><a href="../articles/key-management-business.html">Key Management: Why Encryption Is Useless Without Managing the Keys</a></h3><p>How to store, rotate, and revoke keys so encryption actually reduces breach impact instead of creating the appearance of protection.</p></div><nav class="publication-versions" aria-label="Available language versions"><a href="../../ru/articles/key-management-business.html">RU</a><a href="../articles/key-management-business.html" aria-current="true">EN</a></nav></article>'),
              ('ai', 'semantic-cache-business.html', '<article class="publication-item"><div class="publication-meta"><span>5 min</span></div><div class="publication-copy"><p class="publication-source">Architecture · article</p><h3><a href="../articles/semantic-cache-business.html">Semantic Cache: When AI Should Not Answer Almost the Same Question Again</a></h3><p>How to reduce AI cost and latency without returning stale or cross-user answers because the cache treated different requests as equivalent.</p></div><nav class="publication-versions" aria-label="Available language versions"><a href="../../ru/articles/semantic-cache-business.html">RU</a><a href="../articles/semantic-cache-business.html" aria-current="true">EN</a></nav></article>'),
            ]
          }

          def insert_card(text, section_id, slug, card):
              if slug in text:
                  return text
              m = re.search(r"<section class=['\"]architecture-category['\"] id=['\"]" + re.escape(section_id) + r"['\"]>", text)
              if not m:
                  raise RuntimeError(f'section {section_id} not found')
              start = m.start()
              n = re.search(r"<section class=['\"]architecture-category['\"] id=['\"]", text[m.end():])
              end = m.end() + n.start() if n else len(text)
              segment = text[start:end]
              pos = segment.rfind('</div></section>')
              if pos < 0:
                  raise RuntimeError(f'publication list end for {section_id} not found')
              absolute = start + pos
              return text[:absolute] + card + text[absolute:]

          for path, cards in updates.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for section, slug, card in cards:
                  text = insert_card(text, section, slug, card)
              p.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap-architecture.xml')
          s = sitemap.read_text(encoding='utf-8')
          slugs = ['backpressure-business','database-indexing-business','cell-based-architecture','key-management-business','semantic-cache-business']
          additions = ''.join(f'<url><loc>https://kurakin.pro/{lang}/articles/{slug}.html</loc></url>' for slug in slugs for lang in ('ru','en') if f'https://kurakin.pro/{lang}/articles/{slug}.html' not in s)
          s = s.replace('</urlset>', additions + '</urlset>')
          sitemap.write_text(s, encoding='utf-8')

          for path in updates:
              text = Path(path).read_text(encoding='utf-8')
              for _, slug, _ in updates[path]:
                  assert slug in text, (path, slug)
          for slug in slugs:
              assert f'https://kurakin.pro/ru/articles/{slug}.html' in s
              assert f'https://kurakin.pro/en/articles/{slug}.html' in s
          PY
      - name: Commit changes and clean helper files
        shell: bash
        run: |
          git config user.name "anton-dot"
          git config user.email "66353024+anton-dot@users.noreply.github.com"
          git rm -f .github/workflows/update-architecture-batch.yml .architecture-batch-trigger
          git add ru/architecture/index.html en/architecture/index.html sitemap-architecture.xml
          git commit -m "Add next architecture articles to catalog"
          git push